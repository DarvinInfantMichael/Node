<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width,initial-scale=1.0">

        <title>Day1 - Form Handling</title>
        <link rel="stylesheet" href="./output.css">
    </head>

    <body>

        <div>
            <h1>Student Registration form</h1>

            <form id="studentForm">

                <div>

                <label>Enter Student Name:</label>
                <input type="text"
                placeholder="Enter Student Name to Register"
                id="studName"/>

                <br/>

                <label>Enter Student Email:</label>
                <input type="text"
                placeholder="Enter the Student Email Here...."
                id="studEmail"/>
                <br></br>

                <label>Enter Student Course:</label>
                <input type="text"
                placeholder="Enter the Course Here.."
                id="studCourse"/>
                <br></br>

                </div>
                <div>
                    <button type="submit">Register</button>
                </div>
            </form>

            <div id="result">
            </div>
        </div>

        <script src="./script.js"></script>
    </body>

</html>
