<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 2 - Form Validation</title>

    <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

        <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">
            Student Registration
        </h1>

        <form id="studentForm" novalidate>

            <!-- Student Name -->
            <div class="mb-4">

                <label for="studName" class="block mb-2 font-medium">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studName"
                    placeholder="Enter your name"
                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500"
                >

                <p id="nameError" class="text-red-600 text-sm mt-1"></p>

            </div>

            <!-- Email -->
            <div class="mb-4">

                <label for="studEmail" class="block mb-2 font-medium">
                    Email Address
                </label>

                <input
                    type="text"
                    id="studEmail"
                    placeholder="Enter your email"
                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500"
                >

                <p id="emailError" class="text-red-600 text-sm mt-1"></p>

            </div>

            <!-- Mobile -->
            <div class="mb-4">

                <label for="studMobile" class="block mb-2 font-medium">
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="studMobile"
                    placeholder="Enter 10-digit mobile number"
                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500"
                >

                <p id="mobileError" class="text-red-600 text-sm mt-1"></p>

            </div>

            <!-- Course -->
            <div class="mb-5">

                <label for="studCourse" class="block mb-2 font-medium">
                    Select Course
                </label>

                <select
                    id="studCourse"
                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500"
                >

                    <option value="">Choose a course</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>

                </select>

                <p id="courseError" class="text-red-600 text-sm mt-1"></p>

            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg"
            >
                Register
            </button>

        </form>

        <div id="result" class="mt-5 text-center font-medium"></div>

    </div>

    <script src="./script.js"></script>

</body>

</html>
